server {
    listen 443 ssl;
    server_name proxy.domain.com; # Replace with your actual proxy domain

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        set $target_url "";

        if ($request_uri ~* "^/\?url=(.*)$") {
            set $target_url $1;
        }

        rewrite_by_lua_block {
            local target = ngx.unescape_uri(ngx.var.target_url)

            -- Single validation function
            local function validate(url)
                local scheme, host = url:match("^(https?)://([^/:]+)")
                if not scheme then return nil, "invalid URL" end
                if scheme ~= "https" then return nil, "only HTTPS allowed" end

                local allowed = {
                    ["c.webengage.com"] = true,
                    ["p.webengage.com"] = true,
                    ["msdk-files.webengage.com"] = true,
                    ["wsdk-files.webengage.com"] = true,
                    ["ssl.widgets.webengage.com"] = true,
                    ["api.webengage.com"] = true,
                    ["dashboard.webengage.com"] = true,
                    ["afiles.webengage.com"] = true,
                    ["efiles.webengage.com"] = true,
                    ["ofiles.webengage.com"] = true,
                    ["afiles-io.webengage.com"] = true,
                    ["efiles-io.webengage.com"] = true,
                    ["mfiles.webengage.com"] = true,
                }

                if not allowed[host:lower()] then return nil, "domain not allowed" end
                return true
            end

            local ok, err = validate(target)
            if not ok then
                ngx.status = 403
                ngx.say("Forbidden: " .. err)
                return ngx.exit(403)
            end

            ngx.var.target_url = target
        }

        proxy_pass $target_url;
        resolver 8.8.8.8 ipv6=off;
        proxy_ssl_session_reuse on;
        proxy_ssl_server_name on;
        proxy_pass_request_headers on;
    }
}
